# The library catalog ledger, whole domain, in closed shapes. Each operation says what it does
# (create, change, read, query) and to which things; transformation/design/derive/compose.py selects the blocks.
# Normalized by hand from LEDGER_BRIEF_RUN_LIBRARY_CATALOG.yaml and
# LEDGER_OWNER_ANSWERS_LIBRARY_CATALOG.yaml. `from` names the entry each value comes from.
# Those files are in git history at 3859bec, under decision_authoring_prototype/domains/book_library_mgmt/.

domain: book_library_mgmt
subdomain: catalog

purpose:
  says: "The catalog governs the library's single authoritative record for each work, each edition it holds and each physical copy it owns. It exists because a community library holding thousands of books maintains its catalog records manually, which produces inconsistent descriptions, duplicate entries and difficulty locating materials. It owns the description of what the library holds and the operations that maintain that description, and it governs none of the nine remaining functions of the library project."
  from: "cr_01 P0 (fixtures/catalog/cr_01_catalog) §0 Subdomain Purpose; works and editions from cr_02 P0 (fixtures/catalog/cr_02_catalog) §2"
out_of_scope:
  - item: "Circulation, patrons, staff, reservations, acquisitions, inventory, notifications, policy and reporting"
    reason: "The nine remaining functions of the library project; this domain is the catalog only."
    from: "cr_01 P0 (fixtures/catalog/cr_01_catalog) §12 Out of Scope"
  - item: "Deciding which staff are authorized"
    reason: "That belongs to the staff function; the catalog reads authorization and never grants it."
    from: "cr_01 P0 (fixtures/catalog/cr_01_catalog) §12 Out of Scope (Staff)"
  - item: "Retirement of a work"
    reason: "A work is not retired; a work whose editions are all retired is simply that."
    from: "cr_02 P0 (fixtures/catalog/cr_02_catalog) §12 Out of Scope"
  - item: "Import of the records staff maintain manually today"
    reason: "The catalog starts empty."
    from: "cr_01 P0 (fixtures/catalog/cr_01_catalog) §12 Out of Scope"

actor:
  name: library staff
  role: staff
  kind: human
  authorized_when: [{field: staff_id, op: not_null}, {field: authorized, op: eq, value: true}]
  from: "brief-run actor / all operations"

things:
  work:
    why:
      says: "A published work, recognizable as one thing across the editions in which it is published, so staff find every edition of it together."
      from: "cr_02 P0 (fixtures/catalog/cr_02_catalog) §2 Business Vocabulary (Work)"
    plural: works
    required: {title: string, author: string}
    identity: {field: work_key, from: [title, author], normalized: true, on_duplicate: reuse}
    from: "owner answers / required work, identity work; brief-run states / work (never retired)"
  book:
    why:
      says: "An edition the library catalogs: the single authoritative description of one publication of a work, so the catalog describes what the library holds as it actually is."
      from: "cr_02 P0 (fixtures/catalog/cr_02_catalog) §2 Business Vocabulary (Edition, Bibliographic Accuracy)"
    plural: books
    required: {title: string, author: string, publication_year: integer, subject: array}
    non_empty: [subject]
    identity: {field: identity_key, from: [title, author, publication_year], normalized: true, on_duplicate: refuse}
    belongs_to: work
    states: [registered, retired]
    from: "brief-run required / book (amended: no description); identity / book; states / book"
  physical copy:
    why:
      says: "An individual copy the library owns, belonging to exactly one edition and told apart from every other copy by its barcode."
      from: "cr_01 P0 (fixtures/catalog/cr_01_catalog) §2 Business Vocabulary (Physical Copy, Barcode)"
    plural: physical copies
    identity: {field: barcode, on_duplicate: refuse}
    belongs_to: book
    states: [registered, retired]
    from: "brief-run identity / copy; states / copy"

operations:
  register book:
    does: create
    creates: [book, physical copy]
    parent: create_or_reuse
    from: "brief-run precondition / register_book_with_first_copy"
  register additional edition:
    does: create
    creates: [book]
    parent: existing
    from: "brief-run precondition / register_further_edition"
  register physical copy:
    does: create
    creates: [physical copy]
    parent: existing
    from: "brief-run precondition / register_copy"
  update bibliographic information:
    does: change
    thing: book
    precondition: exists
    may_change: [title, author, publication_year, subject]
    refuse_if: duplicate
    keeps: [state]
    on_identity_change: {work: follows, children: follow, old_identity: freed, history: kept}
    seed: "cr_01 P0 §3: An update to bibliographic information may change the title, author or publication year. The update is refused when the changed title, author and publication year would match another registered book."
    from: "owner, 2026-10-27: keep P0's rule (replaces the earlier answer that identity may not change); the edition moves to the work its new title and author name; the old identity is freed and its copies follow"
  retire book record:
    does: change
    thing: book
    from_state: registered
    to_state: retired
    from: "brief-run states / book; precondition / retire_book (owner: wrong-state transition refused)"
  reinstate book record:
    does: change
    thing: book
    from_state: retired
    to_state: registered
    from: "brief-run states / book; precondition / reinstate_book"
  retire physical copy:
    does: change
    thing: physical copy
    from_state: registered
    to_state: retired
    from: "brief-run states / copy; owner confirmed"
  reinstate physical copy:
    does: change
    thing: physical copy
    from_state: retired
    to_state: registered
    from: "brief-run states / copy"
  retrieve book details:
    does: read
    thing: book
    with: [work, physical copy]
    from: "brief-run query_returns / retrieve_book_details; owner answers / nothing_found retrieve"
  search catalog:
    does: query
    thing: book
    always_exclude: {state: retired}
    caller_may_override: false
    criteria: caller
    group_by: work
    nothing_found: empty
    from: "brief-run query_returns / search; owner answers / search override, empty search"

trail:
  records: [operation, staff_id, subject]
  subject: identity
  moment: operation
  reads: true
  from: "owner answers / trail detail; baseline (reads trailed, not decided by the owner)"

announces:
  register book: [work registered, book registered, physical copy registered]
  register additional edition: [book registered]
  register physical copy: [physical copy registered]
  update bibliographic information: [bibliographic information updated]
  retire book record: [book retired]
  reinstate book record: [book reinstated]
  retire physical copy: [physical copy retired]
  reinstate physical copy: [physical copy reinstated]
  from: "owner answers / announces"

events:
  work registered: {carries: [work_key, title, author]}
  book registered: {carries: [identity_key, title, author, publication_year, barcode, staff_id]}
  from: "baseline event content (decision 34), kept"
