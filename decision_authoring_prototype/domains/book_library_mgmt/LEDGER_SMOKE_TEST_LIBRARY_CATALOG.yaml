domain: library_catalog
purpose: Library staff keep the catalog of the books the library holds and the copies it owns.
answers:
  - ask: purpose
    about: the catalog
    answer: "Staff record each title the library holds and every physical copy of it, so anyone can find what the library owns and where it is."
    decided_by: catalog owner
  - ask: operations
    about: the catalog
    answer: [add_title, revise_title, retire_title, add_copy, shelve_copy, relocate_copy, report_copy_missing, report_copy_found, withdraw_copy, find_titles, view_title]
    decided_by: catalog owner
  - ask: actor
    about: changes to titles (add_title, revise_title, retire_title)
    answer: {who: cataloger, authorized_by: cataloging role granted by catalog owner}
    decided_by: catalog owner
  - ask: actor
    about: changes to copies (add_copy, shelve_copy, relocate_copy, report_copy_missing, report_copy_found)
    answer: {who: library staff member, authorized_by: staff account at the holding branch}
    decided_by: catalog owner
  - ask: actor
    about: withdraw_copy
    answer: {who: branch collection manager, authorized_by: collection management role}
    decided_by: head of collections
  - ask: actor
    about: reading the catalog (find_titles, view_title)
    answer: {who: any library staff member, authorized_by: staff account}
    decided_by: catalog owner
  - ask: actor
    about: whether patrons may search the catalog directly
    open: true
    why: the public catalog is a library-wide decision for the director, not mine alone
  - ask: things
    about: the catalog
    answer:
      title: "a book as published — one edition of a work"
      copy: "one physical item the library owns; belongs to exactly one title; a title has zero or more copies"
    decided_by: catalog owner
  - ask: required
    about: title
    answer:
      isbn: {type: text, required: false}
      title: {type: text, required: true}
      authors: {type: list of names, required: true}
      edition: {type: text, required: false}
      publisher: {type: text, required: false}
      year_published: {type: year, required: false}
      subjects: {type: list of subject headings, required: false}
      call_number: {type: text, required: true}
    decided_by: catalog owner
  - ask: required
    about: copy
    answer:
      barcode: {type: text, required: true}
      title: {type: reference to a title, required: true}
      branch: {type: branch name, required: true}
      shelf_location: {type: text, required: true}
      date_acquired: {type: date, required: true}
      condition_note: {type: text, required: false}
    decided_by: catalog owner
  - ask: identity
    about: title
    answer: {same_when: [isbn], normalized: true, normalization: "ignore hyphens and spaces; a 10-digit ISBN equals its 13-digit form", on_duplicate: refuse}
    decided_by: catalog owner
  - ask: identity
    about: title without an ISBN (older or self-published books)
    open: true
    why: matching on title+author+edition+year risks false duplicates; needs the cataloging team's standard
  - ask: identity
    about: copy
    answer: {same_when: [barcode], normalized: false, on_duplicate: refuse}
    decided_by: catalog owner
  - ask: states
    about: title
    answer:
      states: [active, retired]
      moves: {add_title: "->active", retire_title: active->retired}
    decided_by: catalog owner
  - ask: states
    about: copy
    answer:
      states: [in_processing, on_shelf, missing, withdrawn]
      moves:
        add_copy: "->in_processing"
        shelve_copy: in_processing->on_shelf
        report_copy_missing: on_shelf->missing
        report_copy_found: missing->on_shelf
        withdraw_copy: "on_shelf->withdrawn, missing->withdrawn"
      note: "whether a copy is out on loan is circulation's business, not a catalog state"
    decided_by: catalog owner
  - ask: precondition
    about: add_copy
    answer: {must_hold: ["the title exists and is active", "the barcode is not already in use"]}
    decided_by: catalog owner
  - ask: precondition
    about: revise_title, relocate_copy, report_copy_missing, report_copy_found, shelve_copy
    answer: {must_hold: ["the title or copy exists", "it is in the state the move starts from"]}
    decided_by: catalog owner
  - ask: precondition
    about: retire_title
    answer: {must_hold: ["the title is active", "every copy of it is withdrawn"]}
    decided_by: catalog owner
  - ask: precondition
    about: withdraw_copy
    answer: {must_hold: ["the copy is on_shelf or missing", "a withdrawal reason is given: damaged, worn, outdated, lost, or weeded"]}
    decided_by: head of collections
  - ask: precondition
    about: withdrawing a copy that circulation shows out on loan
    open: true
    why: depends on circulation's rules for lost-and-paid items; must consult the circulation supervisor
  - ask: invariant_on_change
    about: revise_title
    answer: {may_not_change: ["isbn once copies exist", "which copies belong to the title"]}
    decided_by: catalog owner
  - ask: invariant_on_change
    about: relocate_copy and other copy changes
    answer: {may_not_change: [barcode, the title it belongs to, date_acquired]}
    decided_by: catalog owner
  - ask: invariant_on_change
    about: withdrawn copies and retired titles
    answer: {may_not_change: [everything; they are kept as record and never edited or reused]}
    decided_by: catalog owner
  - ask: invariant_on_change
    about: how long withdrawn copies and retired titles are kept
    open: true
    why: record retention is set by library policy and possibly municipal records law
  - ask: query_excludes
    about: find_titles
    answer: {always_excluded: [retired titles, withdrawn copies], caller_may_override: true, override_by: cataloger}
    decided_by: catalog owner
  - ask: query_returns
    about: find_titles
    answer: {returns: [title, authors, edition, year_published, call_number, count of copies on_shelf per branch], grouping: one row per title}
    decided_by: catalog owner
  - ask: query_returns
    about: view_title
    answer: {returns: [all title details, each copy with barcode, branch, shelf_location, state], grouping: copies grouped by branch}
    decided_by: catalog owner
  - ask: nothing_found
    about: find_titles
    answer: {result: empty list}
    decided_by: catalog owner
  - ask: nothing_found
    about: view_title of a title that does not exist
    answer: {result: refused, reason: no such title}
    decided_by: catalog owner
  - ask: trail
    about: every changing operation
    answer: {records: [staff member, operation, when, which title or copy, values before, values after, reason when given]}
    decided_by: catalog owner
  - ask: trail
    about: reading operations
    answer: {records: nothing}
    decided_by: catalog owner
  - ask: announces
    about: changing operations
    answer:
      add_title: {event: title_added, carries: [title, isbn, call_number]}
      revise_title: {event: title_revised, carries: [title, what changed]}
      retire_title: {event: title_retired, carries: [title]}
      add_copy: {event: copy_added, carries: [barcode, title, branch]}
      shelve_copy: {event: copy_shelved, carries: [barcode, branch, shelf_location]}
      relocate_copy: {event: copy_relocated, carries: [barcode, from branch and shelf, to branch and shelf]}
      report_copy_missing: {event: copy_missing, carries: [barcode, branch]}
      report_copy_found: {event: copy_found, carries: [barcode, branch]}
      withdraw_copy: {event: copy_withdrawn, carries: [barcode, title, reason]}
    decided_by: catalog owner
  - ask: announces
    about: reading operations
    answer: {event: none}
    decided_by: catalog owner
cases:
  - when: add_title
    given: {"ISBN 978-0-14-118776-1": active title "Middlemarch"}
    request: {isbn: "9780141187761", title: "Middlemarch", authors: ["George Eliot"], call_number: "FIC ELI"}
    then: refused
    because: the same ISBN written without hyphens is the same title
  - when: add_title
    given: {"ISBN 0-14-118776-X": not in catalog}
    request: {isbn: "0141187761X", title: "Middlemarch"}
    then: refused
    because: authors and call number are required
  - when: add_copy
    given: {"Middlemarch": active, "barcode 31001": not in use}
    request: {title: "Middlemarch", barcode: "31001", branch: "Main", shelf_location: "Fiction E", date_acquired: "2026-03-02"}
    then: copy recorded in_processing
    because: new copies are processed before they reach the shelf
  - when: add_copy
    given: {"barcode 31001": a withdrawn copy of "Emma"}
    request: {title: "Middlemarch", barcode: "31001"}
    then: refused
    because: barcodes are never reused, even from withdrawn copies
  - when: add_copy
    given: {"Old Atlas": retired}
    request: {title: "Old Atlas", barcode: "31050"}
    then: refused
    because: copies cannot be added to a retired title
  - when: shelve_copy
    given: {"copy 31001": in_processing}
    request: {copy: "31001"}
    then: copy on_shelf
    because: processing is complete
  - when: report_copy_missing
    given: {"copy 31001": on_shelf}
    request: {copy: "31001"}
    then: copy missing
    because: shelf check could not find it
  - when: withdraw_copy
    given: {"copy 31001": missing}
    request: {copy: "31001", reason: lost}
    then: copy withdrawn
    because: a missing copy not found may be written off as lost
  - when: withdraw_copy
    given: {"copy 31002": on_shelf}
    request: {copy: "31002"}
    then: refused
    because: a withdrawal reason is required
  - when: retire_title
    given: {"Middlemarch": active, "copy 31001": withdrawn, "copy 31002": on_shelf}
    request: {title: "Middlemarch"}
    then: refused
    because: a title cannot be retired while it still has copies in the collection
  - when: revise_title
    given: {"Middlemarch": active with one copy}
    request: {title: "Middlemarch", isbn: "9780199536757"}
    then: refused
    because: the ISBN of a title with copies cannot change; catalog a new title for a different edition
  - when: relocate_copy
    given: {"copy 31002": on_shelf at Main, Fiction E}
    request: {copy: "31002", branch: "Eastside", shelf_location: "Fiction E"}
    then: copy on_shelf at Eastside, Fiction E
    because: copies move between branches; barcode and title stay the same
  - when: find_titles
    given: {"Old Atlas": retired}
    request: {words: "Old Atlas", by: library staff member}
    then: empty list
    because: retired titles are excluded unless a cataloger asks to include them
  - when: find_titles
    given: {"Old Atlas": retired}
    request: {words: "Old Atlas", by: cataloger, include_retired: true}
    then: "Old Atlas returned with 0 copies on shelf"
    because: catalogers may override the exclusion
  - when: view_title
    given: {"Unknown Book": not in catalog}
    request: {title: "Unknown Book"}
    then: refused
    because: there is no such title
