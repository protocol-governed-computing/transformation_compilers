# The blockchain ledger, whole domain, in closed shapes.
# Normalized by hand from LEDGER_BRIEF_RUN_BLOCKCHAIN.yaml (the blind run, "brief-run") and
# LEDGER_OWNER_ANSWERS_BLOCKCHAIN.yaml ("owner"). `from` names the entries each value comes from.
# Doctrine (engine/doctrine.yaml) is not restated here: own_values, rules_held and
# failed_record_ends replace the brief-run's value_source (fixed, clock),
# request_cannot_override and on_record_failure.

domain: blockchain

actor:
  name: participant
  kind: human
  authorization: none
  attributes:
    contact_address: string
    name: string
    currency_preference: {type: string, default: BACHI}
    language: {type: string, default: en}
  authority: {named_by: request, checked: false}
  from: "brief-run actor / register, create wallet; required / registration; value_source / registration (defaults); owner / authority deferred"

parts:
  identity:
    from: "brief-run parts / identity"
    things:
      actor:
        plural: actors
        required: {name: string, contact_address: string}
        defaults: {currency_preference: BACHI, language: en}
        identity: {field: contact_address, normalized: false, on_duplicate: repeat}
        states: [unverified, accepted, rejected]
        from: "brief-run required / registration; value_source / registration; identity / actor; states / actor; owner / normalization"
    operations:
      register actor:
        kind: register
        thing: actor
        on_repeat:
          records: [name, currency_preference, language]
          announces: actor registered again
        from: "brief-run precondition / register; on_repeat / register; owner / repeated registration records and announces"
      accept actor:
        kind: decide
        thing: actor
        from_state: unverified
        to_state: accepted
        decided_by: verifying_authority
        not_self: true
        may_change: [state, verifying_authority, grounds]
        from: "brief-run precondition / accept; invariant_on_change / accept; required_when / decision (grounds optional)"
      reject actor:
        kind: decide
        thing: actor
        from_state: unverified
        to_state: rejected
        decided_by: verifying_authority
        not_self: true
        may_change: [state, verifying_authority, grounds]
        required: [grounds]
        from: "brief-run precondition / reject; invariant_on_change / reject; required_when / decision"
      list actors:
        kind: list
        thing: actor
        criteria: [state]
        nothing_found: empty
        from: "owner / list actors by state, inside only, empty answer; brief-run query_returns / list actors by state"
    trail:
      records: [contact_address, verifying_authority, grounds]
      subject: contact_address
      from: "brief-run trail / blockchain; owner / refused acts record nothing"
    announces:
      register actor: [actor registered unverified]
      accept actor: [actor accepted]
      reject actor: [actor rejected]
      from: "brief-run announces / register; owner / announces accept, reject"
    events:
      actor registered unverified: {carries: [contact_address, occurred_at]}
      actor registered again: {carries: [contact_address, name, currency_preference, language, occurred_at]}
      actor accepted: {carries: [contact_address, verifying_authority, grounds, occurred_at]}
      actor rejected: {carries: [contact_address, verifying_authority, grounds, occurred_at]}
      from: "owner / announces; brief-run announces / register (repeat carries the submitted details)"

  wallet:
    from: "brief-run parts / wallet"
    things:
      wallet:
        plural: wallets
        identity: {field: wallet_id, from: holder, prefix: wal, on_duplicate: refuse}
        held_by: {thing: actor, field: holder, requires_state: accepted}
        fixed: {balance: 0, denomination: BACHI, classification: DEFAULT, state: ACTIVE}
        derived:
          address: {from: key_material, rule: ethereum address, on_unreadable: refuse, unique: true}
        allowed_values:
          classification: {named: [default, private, business, savings], creatable: [default]}
        states: [active]
        from: "brief-run identity / wallet; value_source / wallet; derived_value / wallet address; allowed_values / wallet classification; states / wallet; owner / wallet identity format, unreadable key, shared key"
    operations:
      create wallet:
        kind: create_held
        thing: wallet
        from: "brief-run precondition / create wallet; owner / separate request, second wallet refused"
    trail:
      records: [holder]
      subject: wallet_id
      from: "brief-run trail / blockchain (one creation moment per wallet)"
    announces:
      create wallet: [wallet created]
      from: "owner / announces create wallet"
    events:
      wallet created: {carries: [wallet_id, holder, occurred_at]}
      from: "owner / announces create wallet"

reads_other_part:
  create wallet: {part: identity, reads: [actor], writes: never}
  from: "brief-run reads_other_part / wallet reading identity"

public_acts:
  register actor: blockchain.register_actor
  accept actor: blockchain.accept_actor
  reject actor: blockchain.reject_actor
  from: "brief-run public_acts / public entrance; owner / public names"
