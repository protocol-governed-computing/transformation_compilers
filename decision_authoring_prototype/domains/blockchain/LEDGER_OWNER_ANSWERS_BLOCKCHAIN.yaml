# The domain owner's answers to the five places where the current P7 and the seeds disagree,
# listed in FINDINGS_DECISION_LEDGER_CENSUS.md. The ledger takes them as decided.
# `baseline` records whether the answer matches the current P7.

answers:
  - ask: operations
    about: create_wallet, when a person gets a wallet
    answer: {operation: create_wallet, separate_request: true, after: accept_actor, carries: [contact_address, key_material]}
    decided_by: domain owner
    seed: cr_04 says a wallet "is not something a person asks for separately"; the owner keeps the separate request, because the key material must be supplied
    baseline: same

  - ask: refuse_if
    about: create_wallet, for a person who already holds one
    answer: {refuse_if: wallet_exists}
    decided_by: domain owner
    seed: cr_04 states both "asking again changes nothing" and a refusal; a refusal changes no record, so both hold
    baseline: same

  - ask: operations
    about: listing actors by state
    answer: {operation: list_actors, reads: actor, criteria: [state], returns: all_fields}
    decided_by: domain owner
    seed: cr_01 asks that the business can list the actors that have been rejected; the owner widens it to any state
    baseline: missing

  - ask: trail
    about: register_actor, a repeated registration
    answer: {on_duplicate: {actor: unchanged, trail: [contact_address, name, currency_preference, language]}}
    decided_by: domain owner
    seed: cr_01, "the differing details of a second registration are recorded as part of the occurrence"
    baseline: differs

  - ask: announces
    about: register_actor, a repeated registration
    answer: {on_duplicate: actor_registered_again, carries: [contact_address, name, currency_preference, language]}
    decided_by: domain owner
    seed: cr_01 names "Actor Registered Again" as a business event
    baseline: missing

# Open questions in LEDGER_BRIEF_RUN_BLOCKCHAIN.yaml that the brief left out. The seeds answer them.

  - ask: announces
    about: accept
    answer: {event: actor_accepted, carries: [contact_address, verifying_authority, grounds, time]}
    decided_by: identity owner
    seed: cr_01 names "Actor Accepted"; cr_04 requires that acceptance is announced, so wallet can act on it
    baseline: same

  - ask: announces
    about: reject
    answer: {event: actor_rejected, carries: [contact_address, verifying_authority, grounds, time]}
    decided_by: identity owner
    seed: cr_01 names "Actor Rejected"
    baseline: same

  - ask: announces
    about: create wallet
    answer: {event: wallet_created, carries: [wallet_identity, holder, time]}
    decided_by: wallet owner
    seed: cr_04, "the business can show the moment a wallet was created, for whom, and when"
    baseline: same

  - ask: public_acts
    about: public names
    answer: {names: {register: blockchain.register_actor, accept: blockchain.accept_actor, reject: blockchain.reject_actor}, others_reached: from inside only}
    decided_by: business owner
    seed: cr_02 offers each act "by name" and gives no names; these are the names callers already use
    baseline: same

# Open questions in LEDGER_BRIEF_RUN_BLOCKCHAIN.yaml that today's design settled without a
# recorded decision. The owner answered each.

  - ask: actor
    about: accept and reject, who counts as an authority
    answer: {authority: named by the request, checked: false, deferred: who may be an authority}
    decided_by: domain owner
    seed: cr_01 defers who may be an authority and requires the decision to name one
    baseline: same

  - ask: actor
    about: list actors by state
    answer: {offered_from_outside: false, checked: false}
    decided_by: domain owner
    baseline: missing

  - ask: operations
    about: show actor
    answer: {dropped: true, because: listing by state covers what the business asked}
    decided_by: domain owner
    baseline: same

  - ask: identity
    about: actor contact address normalization
    answer: {normalized: false}
    decided_by: domain owner
    baseline: same

  - ask: identity
    about: wallet identity format
    answer: {formed_as: "prefix wal with the platform's deterministic id of the holder's contact address"}
    decided_by: domain owner
    baseline: same

  - ask: derived_value
    about: wallet address on unreadable key
    answer: {on_unreadable: refuse, recorded: nothing}
    decided_by: domain owner
    baseline: same

  - ask: identity
    about: wallet address
    answer: {same_when: [address], on_duplicate: refuse}
    decided_by: domain owner
    because: an address belongs to one wallet, so a payment to it is never ambiguous
    baseline: missing

  - ask: nothing_found
    about: list actors by state
    answer: {answer: empty}
    decided_by: domain owner
    baseline: missing

  - ask: trail
    about: refused acts
    answer: {records: nothing}
    decided_by: domain owner
    seed: cr_05 and cr_06, "a refusal changes no record"
    baseline: same

  - ask: entrance_turns_away
    about: missing name or contact address on register
    answer: {answered_by: entrance, as: turned away, act_still_refuses_direct_callers: true}
    decided_by: domain owner
    baseline: same
