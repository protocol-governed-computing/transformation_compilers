# The domain owner's answers to FINDINGS_DECISION_LEDGER_CENSUS.md. No business statement exists
# for this domain's behavior, so the owner is the authority for every answer: no answer cites a seed.
# `baseline` records whether the answer matches the current P7.

authority: domain owner, in place of a seed
facts_source: the business holds its own facts and rules; none is taken from a request

answers:
  - ask: actor
    about: setting the license cap
    answer: {operation: set license cap, performed_by: system authority, announces: license cap set, provisioning_reads: current cap}
    decided_by: domain owner
    baseline: differs   # today the request states the cap

  - ask: allowed_values
    about: inactivity threshold
    answer: {threshold_days: 30, fixed: true, held_by: reclaim}
    decided_by: domain owner
    baseline: differs   # today the request states the threshold

  - ask: operations
    about: training
    answer: {operation: record training completed, announces: training completed, provisioning_reads: the record}
    decided_by: domain owner
    baseline: missing   # today the request states whether training is complete

  - ask: operations
    about: usage
    answer: {operation: record license usage, announces: usage recorded, keeps: last used date, reclaim_reads: [last used date, today from the clock]}
    decided_by: domain owner
    baseline: missing   # today the request states both dates

  - ask: precondition
    about: employees
    answer: {operation: register employee, announces: employee registered, required_by: [record training completed, provision license, record license usage]}
    decided_by: domain owner
    baseline: missing

  - ask: reads_other_part
    about: agent governance reading a user's license
    answer: {reader: agent_governance, owner: ai_licensing, reads: [license status, license tier], writes: never, replaces: the hand-seeded license-facts store}
    decided_by: domain owner
    baseline: differs   # today agent governance reads a store no act writes

  - ask: operations
    about: deny provision
    answer: {dropped: true, because: provisioning denies when a check fails, with the reason that check gives}
    decided_by: domain owner
    baseline: differs

  - ask: identity
    about: license
    answer: {formed_from: employee, prefix: business-chosen, one_active_per_employee: true}
    decided_by: domain owner
    baseline: differs   # today the request supplies the license id

  - ask: allowed_values
    about: license tier at provisioning
    answer: {named_by: request, admitted: [standard, enterprise], one_cap_covers: [standard, enterprise]}
    decided_by: domain owner
    baseline: missing   # today provisioning assigns no tier

  - ask: operations
    about: reclaim
    answer: {trigger: one license at a time, by the system, reclaimed_when: unused for 30 days or more, else: ends still active}
    decided_by: domain owner
    baseline: same      # except that the threshold and dates are no longer taken from the request

  - ask: tables
    about: agent governance
    answer: {tools: unchanged, tier_to_tools: unchanged, parameter_rules: unchanged, denial_reasons: unchanged, prefixes: [AREQ, AGOV]}
    decided_by: domain owner
    baseline: same

  - ask: actor
    about: enterprise runtime
    answer: {dropped: true, because: no act names it}
    decided_by: domain owner
    baseline: differs

  - ask: value_source
    about: the date usage keeps as last used
    answer: {last_used: the moment the use is recorded, from: clock, back_dating: impossible}
    decided_by: domain owner
    baseline: differs   # today the request states the last-active date

  - ask: precondition
    about: a license provisioned and never used
    answer: {counts_from: provisioning, reclaimed_after: 30 days without use}
    decided_by: domain owner
    baseline: missing
