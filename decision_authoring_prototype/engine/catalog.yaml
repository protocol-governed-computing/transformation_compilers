# The question catalog. Every answer a ledger holds answers one of these questions, and
# ledger_schema.json names the question each answer's shape belongs to (`x-question`).
# check_ledger.py refuses a schema that names a question this file does not hold.
# `added_by` names the domain whose run first needed the question. `carried: true` marks a question
# the carried surface answers today: its answer keeps what callers already meet, so the ledger has
# no shape for it. Every other question has a shape in the schema.

questions:
  purpose:             {asked_when: always, added_by: book_library_mgmt,
                        shape: the domain, in one sentence and one name}
  operations:          {asked_when: always, added_by: book_library_mgmt,
                        shape: named operations, each saying what it does (create, change, read, query)}
  actor:               {asked_when: per operation, added_by: book_library_mgmt,
                        shape: who acts, what authorizes them, and who decides a change}
  things:              {asked_when: always, added_by: book_library_mgmt,
                        shape: named things and how they relate}
  required:            {asked_when: per thing, added_by: book_library_mgmt,
                        shape: fields with type, those that may not be empty, and defaults}
  identity:            {asked_when: per thing, added_by: book_library_mgmt,
                        shape: the field, what forms it, normalization, on duplicate, and what frees it}
  states:              {asked_when: per thing with a lifecycle, added_by: book_library_mgmt,
                        shape: states, and which operation moves between them}
  precondition:        {asked_when: per operation, added_by: book_library_mgmt,
                        shape: what must already exist or hold}
  invariant_on_change: {asked_when: per updating operation, added_by: book_library_mgmt,
                        shape: what may change, what may not, and what follows an identity change}
  query_excludes:      {asked_when: per reading operation, added_by: book_library_mgmt,
                        shape: fixed exclusions, and whether a caller may override them}
  query_returns:       {asked_when: per reading operation, added_by: book_library_mgmt,
                        shape: what comes back, by which criteria, and grouping}
  nothing_found:       {asked_when: per reading operation, added_by: book_library_mgmt,
                        shape: an empty answer or a refusal}
  trail:               {asked_when: always, added_by: book_library_mgmt,
                        shape: what each operation records, about which subject, at which moment}
  announces:           {asked_when: per operation, added_by: book_library_mgmt,
                        shape: events, and what each carries}

  parts:               {asked_when: always, added_by: blockchain,
                        shape: parts, and the things and operations each owns}
  required_when:       {asked_when: per field an operation reads, added_by: blockchain,
                        shape: the operations that require it}
  allowed_values:      {asked_when: per field with a named set, added_by: blockchain,
                        shape: the named values, and those that may be created}
  derived_value:       {asked_when: per value formed from supplied material, added_by: blockchain,
                        shape: the source, the named rule, the answer to unreadable material}
  on_repeat:           {asked_when: per operation whose identity may repeat, added_by: blockchain,
                        shape: what a repeat records and announces}
  reads_other_part:    {asked_when: per operation reading another part, added_by: blockchain,
                        shape: the part, what is read, never written}
  public_acts:         {asked_when: always, added_by: blockchain,
                        shape: the acts offered from outside, and their public names}
  entrance_turns_away: {asked_when: per public act, added_by: blockchain, carried: true,
                        shape: what an entrance may refuse, and what it tells the caller}
  outcome_classes:     {asked_when: per public act, added_by: blockchain, carried: true,
                        shape: the answers a caller can receive, and which are kept apart}

  values:              {asked_when: per thing, added_by: ai_governance,
                        shape: the values a new record takes from the business, and those that are the time of the act}
  sets:                {asked_when: per operation recording a fact, added_by: ai_governance,
                        shape: the fields set on an existing record, to a value or to the time}
  refusal_order:       {asked_when: per operation with named checks, added_by: ai_governance,
                        shape: the checks in order; the first that fails decides}
  on_refusal:          {asked_when: per operation whose refusal is kept, added_by: ai_governance,
                        shape: what a refusal announces, and the reason each check gives}
  grants:              {asked_when: per value that unlocks a set of others, added_by: ai_governance,
                        shape: a table from each value to the values it grants}
  value_rules:         {asked_when: per field whose rules depend on another, added_by: ai_governance,
                        shape: a table from each value to the rules on the request's parameters}
  outcome_condition:   {asked_when: per change that waits on a measured condition, added_by: ai_governance,
                        shape: the condition, and where the operation ends when it does not hold}

# Not questions. A citation says where an answer came from; it is carried, never derived from.
citations: [from, seed]
