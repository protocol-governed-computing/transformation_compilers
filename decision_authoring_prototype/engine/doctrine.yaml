# Doctrine: the rules every generated act follows. The author reads them and does not answer them.
# A generated row that follows one cites it as `doctrine:<name>`. generate_domain.py refuses to
# cite a rule this file does not state.

rules:
  order:
    statement: >
      An act authorizes, then validates, then checks its preconditions, then claims, then writes,
      and records its trail last. Every operation records its trail, unless a trail answer says
      otherwise. A read is trailed before it reads, because a workflow answers
      with its last component. After the first claim that can refuse, nothing else may refuse:
      every later claim is checked first by resolving it. A refusal is a component that answers
      VIOLATION, because a workflow reports its last component's answer.

  storage:
    statement: >
      A thing with identity gets a registry. A thing with states or records gets a mutable store.
      A trail gets an append-only store.

  naming:
    statement: >
      Codes come from the author's names. Records and registries are named by the thing's head
      noun. A new artifact starts at V0.

  interface:
    statement: >
      A request carries the actor's credentials and id, plus the operation's inputs. An event
      carries the operation's identifying inputs, the actor and the time, unless the ledger lists
      what it carries. Every component declares an output; one that only writes outputs what its
      write reports.

  binding:
    statement: >
      One resource binding per part names every storage mechanism that part uses.

  reuse:
    statement: >
      One component per thing and purpose. Workflows share them.

  own_values:
    statement: >
      An act states its own values: the rules it applies, the states it writes, the trail it
      records on, the moment it records and every value the business fixes. None is taken from a
      request.
    replaces_question: value_source (fixed, clock)

  rules_held:
    statement: >
      A request that states rules of its own is judged by the business's rules. It is not refused
      for stating them, and it cannot widen them.
    replaces_question: request_cannot_override

  failed_record_ends:
    statement: >
      When a record an act needs cannot be read or written, the act ends refused. Nothing after
      that point runs, and nothing is recorded by it.
    replaces_question: on_record_failure
