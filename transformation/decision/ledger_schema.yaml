# The closed shape of a decision ledger, as JSON Schema (draft 2020-12). Every object is closed:
# an answer outside its shape is refused, never interpreted. Every answer names the catalog
# question it answers (`x-question`, catalog.yaml); `from` and `seed` are citations.
# check_ledger.py applies it, and the references between answers that a schema cannot state.

$schema: https://json-schema.org/draft/2020-12/schema
$id: transformation.decision.LEDGER_SCHEMA_V0
type: object
additionalProperties: false
required: [domain, actor]
anyOf:
  - required: [parts]
  - required: [things, operations, trail]
properties:
  domain: {type: string, pattern: "^[a-z][a-z0-9_]*$", x-question: purpose}
  subdomain: {type: string, pattern: "^[a-z][a-z0-9_]*$", x-question: parts}
  actor: {$ref: "#/$defs/actor"}
  actors:
    type: object
    x-question: actor
    properties: {from: {$ref: "#/$defs/citation"}}
    additionalProperties: {$ref: "#/$defs/named_actor"}
  parts:
    type: object
    x-question: parts
    minProperties: 1
    additionalProperties: {$ref: "#/$defs/part"}
  things: {$ref: "#/$defs/things"}
  operations: {$ref: "#/$defs/operations"}
  trail: {$ref: "#/$defs/trail"}
  announces: {$ref: "#/$defs/announces"}
  events: {$ref: "#/$defs/events"}
  tables: {$ref: "#/$defs/tables"}
  reads_other_part:
    type: object
    x-question: reads_other_part
    properties: {from: {$ref: "#/$defs/citation"}}
    additionalProperties:
      type: object
      additionalProperties: false
      required: [part, reads, writes]
      properties:
        part: {type: string}
        reads: {$ref: "#/$defs/names"}
        writes: {const: never}
  public_acts:
    type: object
    x-question: public_acts
    properties: {from: {$ref: "#/$defs/citation"}}
    additionalProperties: {type: string, pattern: "^[a-z_]+\\.[a-z_]+$"}
  from: {$ref: "#/$defs/citation"}

$defs:
  citation: {type: string, minLength: 1, x-question: citation}
  name: {type: string, pattern: "^[a-z][a-z0-9 ]*$"}
  field: {type: string, pattern: "^[a-z][a-z0-9_]*$"}
  names: {type: array, items: {$ref: "#/$defs/name"}, minItems: 1, uniqueItems: true}
  fields: {type: array, items: {$ref: "#/$defs/field"}, minItems: 1, uniqueItems: true}
  type: {enum: [string, integer, number, boolean, array, object]}
  scalar: {type: [string, integer, number, boolean]}
  fact_map:
    type: object
    minProperties: 1
    propertyNames: {$ref: "#/$defs/field"}
    additionalProperties: {$ref: "#/$defs/scalar"}
  rule:
    type: object
    additionalProperties: false
    required: [field, op]
    properties:
      field: {$ref: "#/$defs/field"}
      op: {enum: [eq, neq, not_null, in, lt, lte, gt, gte]}
      value: {}
      allowed: {type: array}

  actor:
    type: object
    x-question: actor
    additionalProperties: false
    required: [name, kind]
    properties:
      name: {$ref: "#/$defs/name"}
      role: {$ref: "#/$defs/name"}
      kind: {enum: [human, system, agent]}
      authorization: {const: none}
      authorized_when: {type: array, items: {$ref: "#/$defs/rule"}, minItems: 1}
      attributes: {$ref: "#/$defs/attributes"}
      authority:
        type: object
        additionalProperties: false
        properties:
          named_by: {const: request}
          checked: {type: boolean}
      from: {$ref: "#/$defs/citation"}
    oneOf:
      - required: [authorization]
      - required: [authorized_when, role]
  named_actor:
    type: object
    x-question: actor
    additionalProperties: false
    required: [kind, attributes]
    properties:
      kind: {enum: [human, system, agent]}
      part: {$ref: "#/$defs/field"}
      summary: {type: string}
      attributes: {$ref: "#/$defs/attributes"}
  attributes:
    type: object
    propertyNames: {$ref: "#/$defs/field"}
    additionalProperties:
      oneOf:
        - {$ref: "#/$defs/type"}
        - type: object
          additionalProperties: false
          required: [type, default]
          properties: {type: {$ref: "#/$defs/type"}, default: {$ref: "#/$defs/scalar"}}

  part:
    type: object
    additionalProperties: false
    required: [things, operations, trail]
    properties:
      things: {$ref: "#/$defs/things"}
      operations: {$ref: "#/$defs/operations"}
      trail: {$ref: "#/$defs/trail"}
      announces: {$ref: "#/$defs/announces"}
      events: {$ref: "#/$defs/events"}
      tables: {$ref: "#/$defs/tables"}
      from: {$ref: "#/$defs/citation"}

  things:
    type: object
    x-question: things
    minProperties: 1
    propertyNames: {$ref: "#/$defs/name"}
    additionalProperties: {$ref: "#/$defs/thing"}
  thing:
    type: object
    additionalProperties: false
    required: [plural, identity]
    properties:
      plural: {$ref: "#/$defs/name", x-question: things}
      required:
        type: object
        x-question: required
        propertyNames: {$ref: "#/$defs/field"}
        additionalProperties: {$ref: "#/$defs/type"}
      non_empty: {$ref: "#/$defs/fields", x-question: required}
      defaults: {$ref: "#/$defs/fact_map", x-question: required}
      identity: {$ref: "#/$defs/identity"}
      belongs_to: {$ref: "#/$defs/name", x-question: things}
      held_by:
        type: object
        x-question: things
        additionalProperties: false
        required: [thing, field]
        properties:
          thing: {$ref: "#/$defs/name"}
          field: {$ref: "#/$defs/field"}
          requires_state: {$ref: "#/$defs/name", x-question: precondition}
      states: {$ref: "#/$defs/names", x-question: states}
      fixed: {$ref: "#/$defs/fact_map", x-question: values}
      clock: {$ref: "#/$defs/fields", x-question: values}
      derived:
        type: object
        x-question: derived_value
        propertyNames: {$ref: "#/$defs/field"}
        additionalProperties:
          type: object
          additionalProperties: false
          required: [from, rule]
          properties:
            from: {oneOf: [{$ref: "#/$defs/field"}, {$ref: "#/$defs/fields"}]}
            rule: {type: string}
            prefix: {type: string}
            on_unreadable: {const: refuse}
            unique: {type: boolean}
          if: {properties: {rule: {const: generated id}}}
          then: {required: [prefix]}
      allowed_values:
        type: object
        x-question: allowed_values
        propertyNames: {$ref: "#/$defs/field"}
        additionalProperties:
          type: object
          additionalProperties: false
          required: [named]
          properties:
            named: {$ref: "#/$defs/names"}
            creatable: {$ref: "#/$defs/names"}
      from: {$ref: "#/$defs/citation"}
  identity:
    type: object
    x-question: identity
    additionalProperties: false
    required: [field]
    properties:
      field: {$ref: "#/$defs/field"}
      from: {oneOf: [{$ref: "#/$defs/field"}, {$ref: "#/$defs/fields"}]}
      normalized: {type: boolean}
      on_duplicate: {enum: [refuse, reuse, repeat]}
      prefix: {type: string, pattern: "^[A-Za-z]+$"}
      fixed: {type: string}
    oneOf:
      - required: [fixed]
        not: {anyOf: [{required: [from]}, {required: [on_duplicate]}]}
      - required: [on_duplicate]
        not: {required: [fixed]}
    dependentRequired: {prefix: [from]}

  operations:
    type: object
    x-question: operations
    minProperties: 1
    properties: {from: {$ref: "#/$defs/citation"}}
    propertyNames: {$ref: "#/$defs/name"}
    additionalProperties: {$ref: "#/$defs/operation"}
  operation:
    type: object
    additionalProperties: false
    required: [does]
    properties:
      does: {enum: [create, change, read, query], x-question: operations}
      creates: {$ref: "#/$defs/names", x-question: operations}
      thing: {$ref: "#/$defs/name", x-question: operations}
      actor: {$ref: "#/$defs/name", x-question: actor}
      parent: {enum: [create_or_reuse, existing], x-question: precondition}
      precondition: {const: exists, x-question: precondition}
      holds: {$ref: "#/$defs/fact_map", x-question: precondition}
      from_state: {$ref: "#/$defs/name", x-question: states}
      to_state: {$ref: "#/$defs/name", x-question: states}
      decided_by: {$ref: "#/$defs/field", x-question: actor}
      not_self: {type: boolean, x-question: invariant_on_change}
      may_change: {$ref: "#/$defs/fields", x-question: invariant_on_change}
      keeps: {$ref: "#/$defs/fields", x-question: invariant_on_change}
      refuse_if: {const: duplicate, x-question: invariant_on_change}
      on_identity_change:
        type: object
        x-question: invariant_on_change
        additionalProperties: false
        properties:
          work: {const: follows}
          children: {const: follow}
          old_identity: {const: freed}
          history: {const: kept}
      required: {$ref: "#/$defs/fields", x-question: required_when}
      sets:
        type: object
        x-question: sets
        minProperties: 1
        propertyNames: {$ref: "#/$defs/field"}
        additionalProperties: {$ref: "#/$defs/scalar"}
      when:
        type: object
        x-question: outcome_condition
        additionalProperties: false
        required: [unused_for_days, since]
        properties:
          unused_for_days: {type: integer, minimum: 0}
          since: {$ref: "#/$defs/field"}
      otherwise: {$ref: "#/$defs/name", x-question: outcome_condition}
      releases: {const: identity, x-question: identity}
      replaces: {$ref: "#/$defs/names", x-question: replaces}
      checks: {type: array, items: {$ref: "#/$defs/check"}, minItems: 1, x-question: refusal_order}
      on_refusal:
        type: object
        x-question: on_refusal
        additionalProperties: false
        required: [announces]
        properties:
          announces: {$ref: "#/$defs/name"}
          reasons:
            type: object
            additionalProperties: {type: string, pattern: "^[A-Z][A-Z0-9_]*$"}
      on_repeat:
        type: object
        x-question: on_repeat
        additionalProperties: false
        required: [records, announces]
        properties:
          records: {$ref: "#/$defs/fields"}
          announces: {$ref: "#/$defs/name"}
      with: {$ref: "#/$defs/names", x-question: query_returns}
      criteria: {oneOf: [{const: caller}, {$ref: "#/$defs/fields"}], x-question: query_returns}
      group_by: {$ref: "#/$defs/name", x-question: query_returns}
      always_exclude: {$ref: "#/$defs/fact_map", x-question: query_excludes}
      caller_may_override: {type: boolean, x-question: query_excludes}
      nothing_found: {enum: [empty, refuse], x-question: nothing_found}
      seed: {$ref: "#/$defs/citation"}
      from: {$ref: "#/$defs/citation"}
    allOf:
      - if: {properties: {does: {const: create}}}
        then:
          required: [creates]
          not: {anyOf: [{required: [thing]}, {required: [from_state]}, {required: [sets]}, {required: [criteria]}]}
      - if: {properties: {does: {const: change}}}
        then:
          required: [thing]
          not: {anyOf: [{required: [creates]}, {required: [criteria]}, {required: [checks]}]}
          dependentRequired: {from_state: [to_state], to_state: [from_state], when: [otherwise, from_state],
                              otherwise: [when], releases: [from_state]}
          anyOf: [{required: [from_state]}, {required: [sets]}, {required: [may_change]}]
      - if: {properties: {does: {const: read}}}
        then:
          required: [thing]
          not: {anyOf: [{required: [creates]}, {required: [from_state]}, {required: [sets]}, {required: [checks]}]}
      - if: {properties: {does: {const: query}}}
        then:
          required: [thing, criteria]
          not: {anyOf: [{required: [creates]}, {required: [from_state]}, {required: [sets]}, {required: [checks]}]}
      - dependentRequired: {on_refusal: [checks]}

  check:
    type: object
    additionalProperties: false
    required: [name]
    minProperties: 2
    maxProperties: 2
    properties:
      name: {$ref: "#/$defs/name"}
      requires:
        type: object
        x-question: precondition
        additionalProperties: false
        required: [thing, holds]
        properties:
          thing: {$ref: "#/$defs/name"}
          by: {$ref: "#/$defs/field"}
          holds: {$ref: "#/$defs/fact_map"}
      allowed:
        type: object
        x-question: allowed_values
        additionalProperties: false
        required: [field, values]
        properties:
          field: {$ref: "#/$defs/field"}
          values: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
      exists:
        type: object
        x-question: precondition
        additionalProperties: false
        required: [thing]
        properties: {thing: {$ref: "#/$defs/name"}}
      look_up:
        type: object
        x-question: [grants, value_rules]
        additionalProperties: false
        required: [table, key]
        properties:
          table: {$ref: "#/$defs/name"}
          key: {type: string, pattern: "^([a-z][a-z0-9 ]*\\.)?[a-z][a-z0-9_]*$"}
          contains: {$ref: "#/$defs/field"}
          rules_on: {$ref: "#/$defs/field"}
        oneOf: [{required: [contains]}, {required: [rules_on]}]
      count:
        type: object
        x-question: precondition
        additionalProperties: false
        required: [thing, below]
        properties:
          thing: {$ref: "#/$defs/name"}
          holds: {$ref: "#/$defs/fact_map"}
          below:
            type: object
            additionalProperties: false
            required: [thing, field]
            properties: {thing: {$ref: "#/$defs/name"}, field: {$ref: "#/$defs/field"}}

  trail:
    type: object
    x-question: trail
    additionalProperties: false
    required: [records, subject, moment]
    properties:
      records: {$ref: "#/$defs/fields"}
      subject: {$ref: "#/$defs/field"}
      moment: {enum: [event, operation]}
      reads: {type: boolean}
      from: {$ref: "#/$defs/citation"}
  announces:
    type: object
    x-question: announces
    properties: {from: {$ref: "#/$defs/citation"}}
    additionalProperties: {$ref: "#/$defs/names"}
  events:
    type: object
    x-question: announces
    properties: {from: {$ref: "#/$defs/citation"}}
    additionalProperties:
      type: object
      additionalProperties: false
      required: [carries]
      properties: {carries: {$ref: "#/$defs/fields"}}
  tables:
    type: object
    x-question: [grants, value_rules]
    properties: {from: {$ref: "#/$defs/citation"}}
    propertyNames: {$ref: "#/$defs/name"}
    additionalProperties:
      type: object
      minProperties: 1
      additionalProperties:
        type: array
        items:
          oneOf:
            - {type: string}
            - {$ref: "#/$defs/rule"}

x-revisions:
- revision: 1
  change: Sealed as the prototype's rule set, as it derived book_library_mgmt, blockchain and ai_governance.
  digest: sha256:fe05f0fa5be3e5bf8667fa9ff148681e8c735ba37fb17e8940c278b7d45bcf05
- revision: 2
  change: An operation may name the operations it takes the place of (replaces).
  digest: sha256:929186492ed3c7a768ffade5416beb89e70672607af2a1eb859df9880fdb8154
